# Prérequis : data/pokemon.db, construite localement ou téléchargée depuis
#   https://github.com/C-H-U-B/pokemon-rag/releases/latest/download/pokemon.db
# Nommer les services à lancer : un seul conteneur suffit, sauf pour l'interface avec Ollama.
#   API seule, sans modèle :     docker compose up --build api          (http://localhost:8000/docs)
#   Interface Web et Ollama :    docker compose up --build web ollama   (http://localhost:7860, deux conteneurs)
#   Tout arrêter :               docker compose --profile llm down
# Hors Docker, le projet vise LM Studio (défauts de config.py) ; ici, l'interface vise le service ollama.
services:
  api:
    build: .
    image: pokemon-rag:dev
    ports:
      - "8000:8000"
    volumes:
      # La base reste sur la machine hôte ; le conteneur la lit sans pouvoir la modifier.
      - ./data:/app/data:ro

  # Interface Web Gradio et agent ADK. Sans le service ollama (LM Studio, API distante) :
  #   LLM_BASE_URL=http://host.docker.internal:1234/v1 LLM_MODEL=qwen/qwen3-vl-8b docker compose up web
  web:
    profiles: ["llm", "web"]
    build: .
    image: pokemon-rag:dev
    command: ["python", "-m", "pokemon_rag.web.app"]
    ports:
      - "7860:7860"
    environment:
      # Écouter sur toutes les interfaces du conteneur, sinon le port publié reste injoignable.
      GRADIO_SERVER_NAME: "0.0.0.0"
      # Charge la base documentaire dès l'ouverture de la page, pas pendant la première question.
      POKEMON_RAG_PRELOAD: "1"
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-${OLLAMA_MODEL:-qwen3-vl:8b-instruct}}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
    extra_hosts:
      # Rend la machine hôte joignable sous Linux aussi (déjà le cas avec Docker Desktop).
      - "host.docker.internal:host-gateway"
    depends_on:
      # Lancée avec « ollama », l'interface attend que le modèle soit prêt ; seule, elle démarre aussitôt.
      ollama:
        condition: service_healthy
        required: false
    volumes:
      - ./data:/app/data:ro
      # Une ligne par question posée : questions, appels d'outils, temps et réponses.
      - ./traces:/app/traces
      # Index Poképédia dans un volume : lu depuis un dossier Windows partagé, son chargement est
      # nettement plus lent. Le remplir une fois, et après chaque réindexation :
      #   docker compose run --rm --no-deps -v "${PWD}/chroma_db:/source:ro" web sh -c "cp -a /source/. /app/chroma_db/"
      - chroma:/app/chroma_db
      # Modèles d'embedding et de reclassement, téléchargés au premier usage (930 Mo).
      - huggingface:/root/.cache/huggingface

  # Serveur de modèle, compatible OpenAI sur http://localhost:11434/v1. Il télécharge lui-même
  # le modèle au premier démarrage (6,1 Go ; même variante Instruct que sous LM Studio).
  # Avec une carte NVIDIA, ajouter « -f compose.yaml -f compose.gpu.yaml » après « docker compose ».
  ollama:
    profiles: ["llm"]
    image: ollama/ollama
    ports:
      - "11434:11434"
    # Démarre le serveur, attend qu'il réponde, puis récupère le modèle s'il manque au volume.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server=$$!
        trap 'kill $$server' TERM INT
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL" || echo "Modèle non récupéré : $$OLLAMA_MODEL (hors ligne ?)"
        wait $$server
    healthcheck:
      # Sain une fois le modèle présent : l'interface attend ce signal avant de démarrer.
      test: ["CMD-SHELL", "ollama list | grep -q \"$$OLLAMA_MODEL\""]
      interval: 10s
      timeout: 5s
      retries: 3
      # Le premier téléchargement peut durer longtemps : ses échecs ne comptent pas.
      start_period: 60m
      start_interval: 5s
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:8b-instruct}
      # Ollama charge par défaut un contexte plus petit que celui que l'agent ADK budgète.
      OLLAMA_CONTEXT_LENGTH: "16384"
      # Garde le modèle chargé entre deux questions : par défaut il est déchargé après 5 minutes
      # d'inactivité, et son rechargement ajoute une vingtaine de secondes à la question suivante.
      OLLAMA_KEEP_ALIVE: "30m"
      # Mémoire du contexte compressée (environ 1,1 Go de moins pour 16 384 tokens) : davantage de
      # couches tiennent sur la carte graphique. Nécessite l'attention « flash ».
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: "q8_0"
    volumes:
      # Les modèles téléchargés survivent aux reconstructions et aux suppressions du conteneur.
      - ollama:/root/.ollama

volumes:
  ollama:
  huggingface:
  chroma:
