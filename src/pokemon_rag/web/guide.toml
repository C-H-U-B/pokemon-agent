raison = "Aucun outil n'a rien trouvé pour répondre, et l'outil ne répond pas de mémoire : la question est trop vague, ne porte pas sur un fait Pokémon, ou est tournée d'une façon qu'il ne sait pas lire. Nommez un Pokémon, vérifiez l'orthographe de son nom, et dites ce que vous voulez en savoir."
