# Contenu de l'onglet « Guide » de l'interface Web. L'onglet ne fait qu'afficher ce fichier.
#
# [[famille]]      : ce qu'on peut demander. Le bouton d'exemple tire une question au hasard dans `questions`.
#                    Une question n'y entre qu'avec une preuve de réussite enregistrée (commentaire au-dessus).
#                    `modeles` : questions à trou, pour les familles servies par la base seule. Une fois sur deux,
#                    le bouton en remplit un avec un nom d'espèce tiré au hasard dans la base : {pokemon}, ou
#                    {de_pokemon} (« de Pikachu », « d'Arcanin »). Réservé aux questions dont la réponse ne dépend
#                    pas de l'exemple ; `noms_exclus`, en tête de fichier, retire les noms qui ne passent pas.
#                    `en_cours` : questions du tirage au défaut connu mais bénin, affichées « en cours d'amélioration ».
# [[indisponible]] : ce que l'outil ne sait pas faire, rangé par raison, avec les questions connues qui échouent
#                    (aucune pour une raison qui ne tient pas à la question : longueur, incident technique)
#                    et, quand il y en a une, la question voisine qui marche.
#                    `issues` (issues de la trace Web) et `messages` (débuts de message d'un refus du guard)
#                    désignent la raison à signaler ; un message prime sur une issue, et signale la raison même
#                    quand le modèle a fini par répondre.
#
# Ces questions sont distinctes des suggestions des boutons « Débutant », « Joueur », « Expert »
# (questions_*.txt), qu'elles reprennent et complètent de variantes.

# Noms que les modèles ne tirent pas. Sonde du 9 octobre 2026, sans modèle, 1 025 espèces × 3 modèles : le nom est
# retrouvé par l'extraction des contraintes et l'outil rend une ligne pour 1 023 espèces ; ces deux noms sont lus
# comme deux Pokémon (« Plusieurs Pokémon ou formes explicites »).
noms_exclus = ["Nidoran♀", "Nidoran♂"]

